stages:
  - build
  - deploy

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"
  KUBERNETES_MEMORY_LIMIT: "2Gi"
  KUBERNETES_MEMORY_REQUEST: "512Mi"
  KUBERNETES_CPU_LIMIT: "2"
  KUBERNETES_CPU_REQUEST: "500m"

cache:
  - key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  - key: "next-$CI_COMMIT_REF_SLUG"
    paths:
      - .next/cache/
    policy: pull-push

build:
  stage: build
  tags:
    - kubernetes-build
  image: node:22-bookworm-slim
  only:
    - main
  variables:
    NODE_OPTIONS: "--max-old-space-size=1536"
    NEXT_BUILD_WORKERS: "1"
  script:
    - npm ci --prefer-offline --no-audit
    - echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" > .env.production
    - npm run build
  artifacts:
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
      - next.config.ts
      - .env.production
    expire_in: 1 week

deploy:
  stage: deploy
  tags:
    - flowers-runner
  only:
    - main
  script:
    - mkdir -p /var/www/moon-flowers
    - cp -r .next/ public/ package.json package-lock.json next.config.ts .env.production /var/www/moon-flowers/
    - cd /var/www/moon-flowers
    - npm ci --production
    - pm2 restart moon-flowers || pm2 start npm --name moon-flowers -- start
  environment:
    name: production
    url: http://$SSH_HOST
