stages:
  - bootstrap
  - build
  - deploy

variables:
  NPM_CONFIG_CACHE: "$CI_PROJECT_DIR/.npm"
  NEXT_TELEMETRY_DISABLED: "1"
  KUBERNETES_MEMORY_LIMIT: "2Gi"
  KUBERNETES_MEMORY_REQUEST: "512Mi"
  KUBERNETES_CPU_LIMIT: "2"
  KUBERNETES_CPU_REQUEST: "500m"
  DEPLOY_PATH: "/var/www/moon-flowers"

cache:
  - key:
      files:
        - package-lock.json
    paths:
      - node_modules/
      - .npm/
    policy: pull-push
  - key: "next-$CI_COMMIT_REF_SLUG"
    paths:
      - .next/cache/
    policy: pull-push

# One-time: installs DEPLOY_PUBKEY into gitlab-runner@moon-flowers (flowers-runner shell).
bootstrap_deploy_ssh:
  stage: bootstrap
  tags:
    - flowers-runner
  cache: {}
  rules:
    - if: $CI_COMMIT_BRANCH == "main" && $DEPLOY_PUBKEY
  script:
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - touch ~/.ssh/authorized_keys && chmod 600 ~/.ssh/authorized_keys
    - grep -qF "$DEPLOY_PUBKEY" ~/.ssh/authorized_keys || echo "$DEPLOY_PUBKEY" >> ~/.ssh/authorized_keys

build:
  stage: build
  tags:
    - kubernetes-build
  image: node:22-bookworm-slim
  only:
    - main
  variables:
    NODE_OPTIONS: "--max-old-space-size=1536"
    NEXT_BUILD_WORKERS: "1"
  script:
    - npm ci --prefer-offline --no-audit
    - echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" > .env.production
    - npm run build
  artifacts:
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
      - next.config.ts
      - .env.production
    expire_in: 1 week

deploy:
  stage: deploy
  tags:
    - kubernetes-deploy
  image:
    name: alpine:3.20
    entrypoint: [""]
  needs:
    - job: build
      artifacts: true
    - job: bootstrap_deploy_ssh
      optional: true
  # Global cache is for build only; do not pull node_modules on deploy.
  cache: {}
  only:
    - main
  variables:
    KUBERNETES_MEMORY_LIMIT: "512Mi"
    KUBERNETES_MEMORY_REQUEST: "128Mi"
    KUBERNETES_CPU_LIMIT: "500m"
    KUBERNETES_CPU_REQUEST: "100m"
  before_script:
    - apk add --no-cache openssh-client
    - eval "$(ssh-agent -s)"
    - install -m 700 -d ~/.ssh
    - |
      if [ -n "${SSH_PRIVATE_KEY_B64}" ]; then
        echo "${SSH_PRIVATE_KEY_B64}" | base64 -d > ~/.ssh/id_ci
        chmod 600 ~/.ssh/id_ci
      elif [ -f "${SSH_PRIVATE_KEY}" ]; then
        install -m 600 "${SSH_PRIVATE_KEY}" ~/.ssh/id_ci
      else
        printf '%s' "${SSH_PRIVATE_KEY}" | tr -d '\r' > ~/.ssh/id_ci
        chmod 600 ~/.ssh/id_ci
      fi
      grep -q 'PRIVATE KEY' ~/.ssh/id_ci || {
        echo "SSH_PRIVATE_KEY must be an OpenSSH/PEM private key (prefer variable type: File)"
        exit 1
      }
      ssh-add ~/.ssh/id_ci
    - |
      if [ -n "$SSH_KNOWN_HOSTS" ]; then
        printf '%s\n' "$SSH_KNOWN_HOSTS" >> ~/.ssh/known_hosts
      else
        ssh-keyscan -H "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null || true
      fi
    - chmod 644 ~/.ssh/known_hosts
  script:
    - test -n "$SSH_HOST" && test -n "$SSH_USER"
    - |
      ssh "${SSH_USER}@${SSH_HOST}" "mkdir -p '${DEPLOY_PATH}' && rm -rf '${DEPLOY_PATH}/.next' '${DEPLOY_PATH}/public'"
    - tar -cf - .next public package.json package-lock.json next.config.ts .env.production | ssh "${SSH_USER}@${SSH_HOST}" "tar -xf - -C '${DEPLOY_PATH}'"
    - |
      ssh "${SSH_USER}@${SSH_HOST}" "
        set -e
        cd '${DEPLOY_PATH}'
        npm ci --omit=dev --no-audit
        pm2 restart moon-flowers || pm2 start npm --name moon-flowers -- start
      "
  environment:
    name: production
    url: https://${SSH_HOST}
