stages:
  - build
  - deploy

variables: {}

cache:
  key:
    files:
      - package-lock.json
  paths:
    - node_modules/
    - .next/cache/

build:
  stage: build
  tags:
    - "flowers-runner"
  image: node:22
  only:
    - main
  before_script:
    - npm cache clean --force
  script:
    - npm ci --prefer-offline --no-audit
    - echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" > .env.production
    - npm run build
  artifacts:
    paths:
      - .next/
      - public/
      - package.json
      - package-lock.json
      - next.config.ts
      - .env.production
    expire_in: 1 week

deploy:
  stage: deploy
  tags:
    - "flowers-runner"
  only:
    - main
  before_script:
    - apt-get update -qq && apt-get install -y -qq openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | ssh-add -
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    - ssh-keyscan -H $SSH_HOST >> ~/.ssh/known_hosts 2>/dev/null
  script:
    - scp -r .next/ public/ package.json package-lock.json next.config.ts .env.production root@$SSH_HOST:/var/www/moon-flowers/
    - ssh root@$SSH_HOST 'cd /var/www/moon-flowers && npm ci --production && pm2 restart moon-flowers || pm2 start npm --name moon-flowers -- start'
  environment:
    name: production
    url: http://$SSH_HOST
